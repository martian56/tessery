name: Task
description: A piece of planned work for someone on the team.
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this needs doing.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: What to do
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer can tell it's finished.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#12"
