name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build again, such as v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        name: Check the tag against Cargo.toml
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::$TAG is not a version tag such as v0.2.0"; exit 1 ;; esac
          version="${TAG#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/server/Cargo.toml | head -n 1)
          if [ "${version%%-*}" != "$cargo_version" ]; then
            echo "::error::The tag is $TAG but apps/server/Cargo.toml says $cargo_version. Bump the version, merge, then tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [server, worker]
    env:
      IMAGE: ghcr.io/martian56/tessery-${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=tessery-${{ matrix.target }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        name: Skip versions that are already published
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION is already published, leaving it as it is"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: ${{ matrix.target }}
          build-args: TESSERY_VERSION=${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ contains(env.VERSION, '-') && '' || format('{0}:latest', env.IMAGE) }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Write the image table
        run: |
          {
            echo "## Images"
            echo
            echo "| Image | Version |"
            echo "|---|---|"
            for target in server worker; do
              echo "| \`ghcr.io/martian56/tessery-$target:$VERSION\` | $VERSION |"
            done
            echo
          } > images.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: images.md
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}
