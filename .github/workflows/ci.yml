name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:engine

  terraform:
    name: Terraform (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, gcp, azure, hetzner, digitalocean]
    defaults:
      run:
        working-directory: packages/core
    env:
      TF_PROVIDER_MIRROR: ${{ github.workspace }}/.terraform-mirror
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - uses: actions/cache@v4
        with:
          path: .terraform-mirror
          key: terraform-mirror-${{ matrix.provider }}-${{ hashFiles('packages/core/src/codegen/terraform/*.ts') }}
          restore-keys: terraform-mirror-${{ matrix.provider }}-

      - run: npm ci
      - run: npm run terraform:fixtures -- dist/terraform ${{ matrix.provider }}
      - run: sh scripts/validate-terraform.sh dist/terraform

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            apps/web/package-lock.json

      - name: Install core
        working-directory: packages/core
        run: npm ci

      - name: Install web
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust tests (${{ matrix.partition }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    env:
      SQLX_OFFLINE: "true"
      TESSERY_TEST_DATABASE_URL: postgres://tessery@localhost:5432/tessery
      TESSERY_TEST_REDIS_URL: redis://localhost:6379
      TESSERY_TEST_AMQP_URL: amqp://tessery:tessery@localhost:5672/%2f
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tessery
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tessery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tessery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: tessery
          RABBITMQ_DEFAULT_PASS: tessery
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        working-directory: apps/server
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Build the engine
        working-directory: packages/core
        run: npm ci && npm run build:engine

      - name: Test
        working-directory: apps/server
        run: cargo nextest run --workspace --partition count:${{ matrix.partition }}/3

      - name: Doc tests
        if: matrix.partition == 1
        working-directory: apps/server
        run: cargo test --workspace --doc
