name: tessery

x-app: &app
  restart: unless-stopped
  environment: &appenv
    TESSERY_DATABASE_URL: postgres://tessery:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tessery
    TESSERY_REDIS_URL: redis://redis:6379
    TESSERY_AMQP_URL: amqp://tessery:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2f
    TESSERY_BIND: 0.0.0.0:8080
    TESSERY_SECRET_KEY: ${TESSERY_SECRET_KEY:?set TESSERY_SECRET_KEY in .env}
    TESSERY_SECRET_KEY_PREVIOUS: ${TESSERY_SECRET_KEY_PREVIOUS:-}
    TESSERY_S3_ENDPOINT: http://seaweedfs:8333
    TESSERY_S3_ACCESS_KEY: tessery
    TESSERY_S3_SECRET_KEY: ${TESSERY_S3_SECRET_KEY:?set TESSERY_S3_SECRET_KEY in .env}
    TESSERY_PUBLIC_URL: https://${TESSERY_DOMAIN:?set TESSERY_DOMAIN in .env}
    TESSERY_TELEMETRY_URL: https://${TESSERY_DOMAIN}
    TESSERY_COOKIE_SECURE: "true"
    TESSERY_TRUST_PROXY: "true"
    TESSERY_COMPOSE_DIR: ${TESSERY_COMPOSE_DIR:-}
    RUST_LOG: ${RUST_LOG:-info}
  volumes:
    - tesserydata:/var/lib/tessery
    - /var/run/docker.sock:/var/run/docker.sock
  group_add: ["${DOCKER_GID:-0}"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    seaweedfs: { condition: service_healthy }

services:
  server:
    <<: *app
    image: ghcr.io/martian56/tessery-server:${TESSERY_IMAGE_TAG:-latest}
    networks: [default, proxy]
    labels:
      caddy: ${TESSERY_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.encode: zstd gzip

  worker:
    <<: *app
    image: ghcr.io/martian56/tessery-worker:${TESSERY_IMAGE_TAG:-latest}

  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
    restart: unless-stopped
    labels:
      tessery.proxy: "true"
    environment:
      CADDY_INGRESS_NETWORKS: tessery-proxy
    networks: [proxy]
    ports:
      - "${TESSERY_HTTP_PORT:-80}:80"
      - "${TESSERY_HTTPS_PORT:-443}:443"
      - "${TESSERY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddydata:/data

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tessery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tessery
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessery -d tessery"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    environment:
      S3_SECRET_KEY: ${TESSERY_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"tessery","credentials":[{"accessKey":"tessery","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes: ["objectdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tessery
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: ["mqdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  proxy:
    name: tessery-proxy
    external: true

volumes:
  pgdata: {}
  redisdata: {}
  mqdata: {}
  objectdata: {}
  tesserydata: {}
  caddydata: {}
